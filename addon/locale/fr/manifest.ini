summary = "Fichier et dossier absolus"
description = """Fichier et dossier absolus améliore la productivité de NVDA en simplifiant l'accès aux fichiers et répertoires grâce à l'intégration de l'Explorateur Windows. Il permet aux utilisateurs de capturer des chemins, d'organiser des favoris, de filtrer les fichiers par extension, de rechercher dans l'historique avec des signaux sonores, d'exécuter des scripts en tant qu'administrateur et de restaurer les dossiers actifs après un redémarrage.
Raccourcis clavier :
Windows+Retour arrière
Un simple appui ouvre AbsoluteFolder
Un double appui ouvre AbsoluteFile"""