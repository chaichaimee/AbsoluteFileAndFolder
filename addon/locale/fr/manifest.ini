summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder améliore la productivité de NVDA en simplifiant l'accès aux fichiers et dossiers grâce à l'intégration de l'Explorateur Windows. Permet aux utilisateurs de capturer des chemins, d'organiser des marque-pages, de filtrer les fichiers par extension, de rechercher dans l'historique avec des signaux sonores, d'exécuter des scripts en tant qu'administrateur et de restaurer les dossiers actifs après un redémarrage.
Raccourcis clavier :
Windows+Backspace
Pression simple : ouvrir AbsoluteFloder
Pression double : ouvrir AbsoluteFile"""