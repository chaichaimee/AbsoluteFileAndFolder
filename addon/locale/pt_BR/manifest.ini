summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder aumenta a produtividade do NVDA simplificando o acesso a arquivos e diretórios por meio da integração com o Windows Explorer. Ele permite capturar caminhos, organizar favoritos, filtrar arquivos por extensão, pesquisar no histórico com sinais sonoros, executar scripts como administrador e restaurar pastas ativas após a reinicialização.
Teclas de atalho:
Windows+Backspace
Pressionar uma vez: abrir AbsoluteFloder
Pressionar duas vezes: abrir AbsoluteFile"""