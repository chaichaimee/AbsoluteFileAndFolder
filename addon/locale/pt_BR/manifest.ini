summary = "Arquivo e Pasta Absolutos"
description = """O Absolute File and Folder aumenta a produtividade do NVDA, simplificando o acesso a arquivos e diretórios por meio da integração com o Explorador do Windows. Ele permite capturar caminhos, organizar favoritos, filtrar arquivos por extensão, pesquisar no histórico com avisos sonoros, executar scripts como administrador e restaurar pastas ativas após uma reinicialização.
Teclas de Atalho:
Windows+Backspace
Um toque abre a Pasta Absoluta
Dois toques abrem o Arquivo Absoluto"""