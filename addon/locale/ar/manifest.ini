summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder تعزز إنتاجية NVDA من خلال تبسيط الوصول إلى الملفات والمجلدات عبر التكامل مع Windows Explorer. وتتيح للمستخدمين التقاط المسارات، وتنظيم الإشارات المرجعية، وتصفية الملفات حسب الامتداد، والبحث في السجل مع تلميحات صوتية، وتشغيل البرامج النصية كمسؤول، واستعادة المجلدات النشطة بعد إعادة التشغيل.
مفاتيح الاختصار:
Windows+Backspace
ضغطة واحدة لتفتح AbsoluteFloder
ضغطتان لتفتح AbsoluteFile"""