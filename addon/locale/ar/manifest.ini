summary = "ملف ومجلد مطلق"
description = """يعزز ملف ومجلد مطلق إنتاجية قارئ الشاشة NVDA من خلال تبسيط الوصول إلى الملفات والمجلدات عبر التكامل مع مستكشف ويندوز. يتيح للمستخدمين التقاط المسارات، وتنظيم الإشارات المرجعية، وتصفية الملفات حسب الامتداد، والبحث في السجل باستخدام مؤشرات صوتية، وتشغيل البرامج النصية كمسؤول، واستعادة المجلدات النشطة بعد إعادة التشغيل.
مفاتيح الاختصار:
مفتاح ويندوز + مسافة تراجع
ضغطة واحدة لفتح المجلد المطلق
ضغطة مزدوجة لفتح الملف المطلق"""