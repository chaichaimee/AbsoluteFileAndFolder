summary = "Berkas dan Folder Mutlak"
description = """Berkas dan Folder Mutlak meningkatkan produktivitas NVDA dengan menyederhanakan akses berkas dan direktori melalui integrasi Windows Explorer. Ini memungkinkan pengguna untuk menangkap jalur, mengatur markah, menyaring berkas berdasarkan ekstensi, mencari riwayat dengan isyarat audio, menjalankan skrip sebagai administrator, dan memulihkan folder aktif setelah komputer dimulai ulang.
Tombol Pintas:
Windows+Backspace
Ketukan Tunggal membuka FolderMutlak
Ketukan Ganda membuka BerkasMutlak"""