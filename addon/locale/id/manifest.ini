summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder meningkatkan produktivitas NVDA dengan mempermudah akses file dan direktori melalui integrasi Windows Explorer. Fitur ini memungkinkan pengguna menyalin jalur, mengelola markah, menyaring file berdasarkan ekstensi, menelusuri riwayat dengan isyarat audio, menjalankan skrip sebagai administrator, dan memulihkan folder aktif setelah mulai ulang.
Tombol Pintas:
Windows+Backspace
Tekan Sekali untuk membuka AbsoluteFloder
Tekan Dua Kali untuk membuka AbsoluteFile"""