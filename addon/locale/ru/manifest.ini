summary = "Абсолютный файл и папка"
description = """Абсолютный файл и папка повышает производительность NVDA, оптимизируя доступ к файлам и каталогам за счет интеграции с Проводником Windows. Аддон позволяет пользователям сохранять пути, организовывать закладки, фильтровать файлы по расширению, искать историю с помощью звуковых сигналов, запускать скрипты от имени администратора и восстанавливать активные папки после перезагрузки.
Горячие клавиши:
Windows+Backspace
Одиночное нажатие открывает Абсолютную папку
Двойное нажатие открывает Абсолютный файл"""