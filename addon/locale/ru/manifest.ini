summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder повышает продуктивность NVDA, упрощая доступ к файлам и каталогам благодаря интеграции с Проводником Windows. Позволяет копировать пути, организовывать закладки, фильтровать файлы по расширению, искать по истории с звуковыми сигналами, запускать скрипты от имени администратора и восстанавливать активные папки после перезагрузки.
Горячие клавиши:
Windows+Backspace
Одинарное нажатие: открыть AbsoluteFloder
Двойное нажатие: открыть AbsoluteFile"""