summary = "Absoluter Datei- und Ordnerpfad"
description = """Absolute File and Folder steigert die NVDA-Produktivität durch die Optimierung des Datei- und Verzeichniszugriffs über die Windows-Explorer-Integration. Sie können damit Pfade erfassen, Lesezeichen verwalten, Dateien nach Erweiterung filtern, den Suchverlauf mit akustischen Signalen durchsuchen, Skripte als Administrator ausführen und aktive Ordner nach einem Neustart wiederherstellen.
Tastenkombinationen:
Windows+Rücktaste
Einfach tippen öffnet AbsoluteFolder
Doppelt tippen öffnet AbsoluteFile"""