summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder migliora la produttività di NVDA semplificando l'accesso a file e cartelle tramite l'integrazione con Esplora File di Windows. Consente di copiare percorsi, organizzare segnalibri, filtrare file per estensione, cercare nella cronologia con segnali acustici, eseguire script come amministratore e ripristinare le cartelle attive dopo un riavvio.
Tasti di scelta rapida:
Windows+Backspace
Pressione singola: apri AbsoluteFloder
Doppia pressione: apri AbsoluteFile"""