summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder는 Windows 탐색기 통합을 통해 파일 및 디렉토리 접근을 간소화하여 NVDA 생산성을 향상시킵니다. 사용자는 경로 캡처, 북마크 정리, 확장자별 파일 필터링, 오디오 신호가 있는 검색 기록 조회, 관리자 권한으로 스크립트 실행, 재부팅 후 활성 폴더 복원을 수행할 수 있습니다.
단축키:
Windows+백스페이스
한 번 누르기: AbsoluteFolder 열기
두 번 누르기: AbsoluteFile 열기"""