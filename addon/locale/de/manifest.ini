summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder steigert die NVDA-Produktivität durch die Optimierung des Datei- und Ordnerzugriffs über die Windows Explorer-Integration. Es ermöglicht das Erfassen von Pfaden, Organisieren von Lesezeichen, Filtern von Dateien nach Erweiterungen, Durchsuchen des Verlaufs mit akustischen Signalen, Ausführen von Skripten als Administrator und Wiederherstellen aktiver Ordner nach einem Neustart.
Tastenkombinationen:
Windows+Backspace
Einfach drücken: AbsoluteFloder öffnen
Doppelt drücken: AbsoluteFile öffnen"""