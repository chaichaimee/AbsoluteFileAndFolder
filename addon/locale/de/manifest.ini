summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder steigert die NVDA-Produktivität durch optimierten Datei- und Verzeichniszugriff über die Windows Explorer-Integration. Das Add-on ermöglicht das Erfassen von Pfaden, Verwalten von Lesezeichen, Filtern von Dateien nach Erweiterung, Durchsuchen des Verlaufs mit Audiosignalen, Ausführen von Skripten als Administrator und das Wiederherstellen aktiver Ordner nach einem Neustart.
Tastenkombinationen:
Windows+Rücktaste
Einfachtippen öffnet AbsoluteFolder
Doppeltippen öffnet AbsoluteFile"""