summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder は、エクスプローラーとの統合によりファイルやディレクトリへのアクセスを効率化し、NVDAの生産性を向上させます。パスの取得、ブックマークの整理、拡張子によるファイルの絞り込み、音声 cue（キュー）付きの履歴検索、管理者権限でのスクリプト実行、再起動後のアクティブフォルダの復元などが可能です。
ショートカットキー:
Windows+Backspace
1回押す: AbsoluteFloder を開く
2回押す: AbsoluteFile を開く"""