summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder, Windows Explorer एकीकरण के माध्यम से फ़ाइल और निर्देशिका पहुंच को व्यवस्थित करके NVDA उत्पादकता को बढ़ाता है। यह उपयोगकर्ताओं को पाथ कैप्चर करने, बुकमार्क व्यवस्थित करने, फ़ाइल एक्सटेंशन द्वारा फ़िल्टर करने, ऑडियो संकेतों के साथ इतिहास खोजने, व्यवस्थापक के रूप में स्क्रिप्ट चलाने और रीबूट के बाद सक्रिय फ़ोल्डरों को पुनर्स्थापित करने की अनुमति देता है।
हॉट-कीज़:
Windows+Backspace
एक बार दबाएं: AbsoluteFloder खोलें
दो बार दबाएं: AbsoluteFile खोलें"""