summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder підвищує продуктивність NVDA, спрощуючи доступ до файлів і каталогів завдяки інтеграції з Провідником Windows. Дозволяє копіювати шляхи, впорядковувати закладки, фільтрувати файли за розширенням, шукати в історії зі звуковими сигналами, запускати скрипти від імені адміністратора та відновлювати активні папки після перезавантаження.
Гарячі клавіші:
Windows+Backspace
Одне натискання: відкрити AbsoluteFloder
Подвійне натискання: відкрити AbsoluteFile"""