summary = "Абсолютні файл і папка"
description = """Абсолютні файл і папка підвищують продуктивність NVDA, спрощуючи доступ до файлів і каталогів завдяки інтеграції з Провідником Windows. Дозволяють користувачам зберігати шляхи, організовувати закладки, фільтрувати файли за розширенням, шукати в історії зі звуковими сигналами, запускати скрипти від імені адміністратора та відновлювати активні папки після перезавантаження.
Гарячі клавіші:
Windows+Backspace
Одинарне натискання відкриває Абсолютну папку
Подвійне натискання відкриває Абсолютний файл"""