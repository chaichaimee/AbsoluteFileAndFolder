summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder mejora la productividad de NVDA al optimizar el acceso a archivos y carpetas mediante la integración con el Explorador de Windows. Permite a los usuarios copiar rutas, organizar marcadores, filtrar archivos por extensión, buscar en el historial con señales auditivas, ejecutar scripts como administrador y restaurar carpetas activas tras reiniciar.
Teclas rápidas:
Windows+Backspace
Pulsación simple: abrir AbsoluteFloder
Pulsación doble: abrir AbsoluteFile"""