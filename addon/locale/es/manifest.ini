summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder mejora la productividad de NVDA al optimizar el acceso a archivos y directorios mediante la integración con el Explorador de Windows. Permite capturar rutas, organizar marcadores, filtrar archivos por extensión, buscar en el historial con indicaciones de audio, ejecutar scripts como administrador y restaurar carpetas activas después de reiniciar.
Teclas de acceso rápido:
Windows+Retroceso
Un solo toque abre AbsoluteFolder
Doble toque abre AbsoluteFile"""