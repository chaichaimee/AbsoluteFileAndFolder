summary = "โฟลเดอร์และไฟล์แบบสมบูรณ์"
description = """Absolute File and Folder ช่วยเพิ่มประสิทธิภาพการทำงานของ NVDA ด้วยการปรับปรุงการเข้าถึงไฟล์และไดเรกทอรีผ่านการบูรณาการกับ Windows Explorer ซึ่งช่วยให้ผู้ใช้สามารถบันทึกเส้นทาง จัดระเบียบบุ๊กมาร์ก กรองไฟล์ตามนามสกุล ค้นหาประวัติพร้อมเสียงแจ้งเตือน เรียกใช้สคริปต์ในฐานะผู้ดูแลระบบ และกู้คืนโฟลเดอร์ที่ใช้งานอยู่หลังจากการรีบูต
คีย์ลัด:
Windows+Backspace
แตะครั้งเดียวเพื่อเปิด AbsoluteFolder
แตะสองครั้งเพื่อเปิด AbsoluteFile"""