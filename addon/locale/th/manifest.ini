summary = "AbsoluteFileAndFolder"
description = """Absolute File and Folder ช่วยเพิ่มประสิทธิภาพการทำงานของ NVDA โดยการช่วยให้เข้าถึงไฟล์และโฟลเดอร์ได้สะดวกรวดเร็วผ่านการทำงานร่วมกับ Windows Explorer ช่วยให้ผู้ใช้สามารถคัดลอกพาธ จัดเก็บบุ๊กมาร์ก กรองไฟล์ตามนามสกุล ค้นหาประวัติการใช้งานพร้อมเสียงตอบรับ รันสคริปต์ในฐานะผู้ดูแลระบบ และคืนค่าโฟลเดอร์ที่เปิดค้างไว้หลังจากการรีสตาร์ท
คีย์ลัด:
Windows+Backspace
กดครั้งเดียว: เปิด AbsoluteFloder
กดสองครั้ง: เปิด AbsoluteFile"""